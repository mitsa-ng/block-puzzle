// 消行粒子（B-3）：單一格產生最多 3 個碎片，parabola 隨機角度/距離飛散＋淡出，animationend 自刪。
// budget 由呼叫端控管（單次事件上限 60 粒），回傳實際產生數量供呼叫端扣除。
function spawnClearParticles(wrap, wrapRect, cellEl, color, budget){
  if(budget<=0) return 0;
  const cellRect=cellEl.getBoundingClientRect();
  const originX=cellRect.left-wrapRect.left+cellRect.width/2;
  const originY=cellRect.top -wrapRect.top +cellRect.height/2;
  const n=Math.min(3,budget);
  for(let i=0;i<n;i++){
    const size=6+Math.random()*2; // 6-8px
    const angle=Math.random()*Math.PI*2;
    const dist=24+Math.random()*28;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist-10; // 略帶向上的拋物線起勢
    const dur=(0.5+Math.random()*0.2).toFixed(2); // 0.5-0.7s
    const frag=document.createElement('div');
    frag.className='clear-particle';
    frag.style.width=size+'px';
    frag.style.height=size+'px';
    frag.style.left=originX+'px';
    frag.style.top=originY+'px';
    frag.style.background=color;
    frag.style.setProperty('--dx',dx+'px');
    frag.style.setProperty('--dy',dy+'px');
    frag.style.animationDuration=dur+'s';
    frag.addEventListener('animationend',()=>frag.remove());
    wrap.appendChild(frag);
  }
  return n;
}
function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function triggerLevelUpFlash(){
  const el=document.getElementById('levelup-flash');
  el.classList.remove('show');
  void el.offsetWidth; // reflow
  el.classList.add('show');
}

// 一次消 ≥2 行時的 combo 慶祝（B5）
function showComboPop(total){
  const board=document.getElementById('board');
  const br=board.getBoundingClientRect();
  const x=br.left+br.width/2, y=br.top+br.height/2;
  const labels={2:'DOUBLE!',3:'TRIPLE!',4:'QUAD!'};
  const text=labels[total] || (total+' LINES!');
  const el=document.createElement('div');
  el.className='combo-pop';
  el.textContent=text;
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
  const wrap=document.querySelector('.board-wrap');
  if(wrap){
    wrap.classList.remove('combo-pulse');
    void wrap.offsetWidth; // reflow
    wrap.classList.add('combo-pulse');
    // B-2 修正：combo-pulse 若滯留不移除，其 `animation` 屬性會因同權重＋較晚宣告而永久蓋掉
    // .board-wrap.danger 的 dangerPulse（兩者共用同一個 board-wrap 元素）。動畫播完即自行移除，
    // 讓 danger 呼吸動畫在下一次 updateDangerState() 後能正常生效。
    wrap.addEventListener('animationend', function onEnd(e){
      if(e.animationName==='comboPulse'){ wrap.classList.remove('combo-pulse'); wrap.removeEventListener('animationend', onEnd); }
    });
  }
}

// 放置失敗回饋：短暫 shake + 紅光（B2）
function flashInvalidCells(piece,sr,sc){
  if(!piece) return;
  sfxInvalid();
  announce('此位置無法放置');
  const cells=[];
  for(let r=0;r<piece.shape.length;r++)
    for(let c=0;c<piece.shape[r].length;c++)
      if(piece.shape[r][c]){
        const gr=sr+r,gc=sc+c;
        if(gr<0||gr>=ROWS||gc<0||gc>=COLS) continue;
        const el=cellEl(gr,gc);
        if(el) cells.push(el);
      }
  cells.forEach(el=>{
    el.classList.remove('invalid-flash');
    void el.offsetWidth; // reflow，允許重複觸發
    el.classList.add('invalid-flash');
    el.addEventListener('animationend', ()=>el.classList.remove('invalid-flash'), {once:true});
  });
  navigator.vibrate?.(50);
}

// 觸控放置失敗：ghost 彈回原本的 piece-slot 再隱藏（B2）
function bounceGhostBack(idx){
  sfxInvalid();
  const g=document.getElementById('ghost');
  const slot=document.querySelector(`.piece-slot[data-idx="${idx}"]`);
  if(!slot){ hideGhost(); return; }
  const r=slot.getBoundingClientRect();
  const tx=r.left+r.width/2, ty=r.top+r.height/2;
  g.style.transition='left 0.28s ease, top 0.28s ease, opacity 0.28s ease';
  g.style.left=tx+'px';
  g.style.top=ty+'px';
  g.style.opacity='0';
  setTimeout(()=>{
    g.style.transition='';
    g.style.display='none';
    g.style.opacity='0.85';
    g.style.transform='translate(-50%,-50%)';
  },300);
  navigator.vibrate?.(50);
}

// 遊戲中首次超越最高分時顯示一次性 toast（B15）
function showRecordToast(){
  sfxRecord();
  const el=document.createElement('div');
  el.className='record-toast';
  el.textContent='🏆 新紀錄！';
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

/* ══════════════════════════════════════
   INTERACTION
   桌面：點擊選取 → 滑鼠移動預覽 → 點擊放置
   移動端：長按/拖動方塊 → 手指移動即時預覽 → 放開放置
          (手指偏移補正：ghost 顯示在手指上方，避免遮擋)
══════════════════════════════════════ */

// ── 共用：取消選取 ──
function deselect(){
  selIdx=null; clearPreview(); hideGhost(); renderPieces();
  document.querySelectorAll('#board .cell').forEach(el=>el.classList.remove('can-select'));
  setHint(isTouchDevice()?'長按方塊開始拖動':'點擊下方方塊來選取', false);
}

const isTouchDevice = () => window.matchMedia('(pointer:coarse)').matches;

// ── 桌面：點擊選取 ──
function onPieceClick(i){
  if(isTouchDevice()) return; // 觸控裝置走 touch 路徑
  if(selIdx===i){ deselect(); return; }
  selIdx=i; clearPreview(); renderPieces(); updateGhost(pieces[i]);
  document.querySelectorAll('#board .cell').forEach(el=>el.classList.add('can-select'));
  setHint('移到格子上預覽，點擊格子放置　ESC 取消', true);
}

// ── 桌面：board hover & click ──
function onBoardMouseOver(e){
  if(selIdx===null||isTouchDevice()) return;
  const el=e.target.closest?e.target.closest('.cell'):null;
  if(!el) return;
  showPreview(pieces[selIdx],+el.dataset.r,+el.dataset.c);
}
function onBoardMouseOut(e){
  if(selIdx===null||isTouchDevice()) return;
  const rel=e.relatedTarget;
  if(rel&&rel.closest&&rel.closest('#board')) return;
  clearPreview();
}
function onBoardClick(e){
  if(selIdx===null||isTouchDevice()) return;
  const el=e.target.closest?e.target.closest('.cell'):null;
  if(!el) return;
  const sr=+el.dataset.r, sc=+el.dataset.c;
  const placed=doPlace(selIdx,sr,sc);
  if(placed){
    selIdx=null; hideGhost();
    document.querySelectorAll('#board .cell').forEach(c=>c.classList.remove('can-select'));
    setHint('點擊下方方塊來選取', false);
  } else {
    flashInvalidCells(pieces[selIdx],sr,sc);
  }
}

// Ghost 跟著滑鼠（桌面）
document.addEventListener('mousemove', e=>{
  if(selIdx===null||isTouchDevice()) return;
  const g=document.getElementById('ghost');
  g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
});

document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  const overlay=document.getElementById('stats-overlay');
  if(overlay && overlay.classList.contains('show')){ closeStatsOverlay(); return; }
  deselect();
});
document.addEventListener('click', e=>{
  if(selIdx===null||isTouchDevice()) return;
  if(!e.target.closest('#board')&&!e.target.closest('.pieces-area')) deselect();
});

/* ══════════════════════════════════════
   鍵盤操作與無障礙（C-3）
   Tab 聚焦 piece-slot（Enter/Space 選取，見 renderPieces）→ 方向鍵在棋盤上移動預覽游標
   （沿用既有 showPreview/previewPos）→ Enter 放置 → Esc 取消（沿用既有 deselect）。
   選取後把 DOM focus 移到 #board（tabindex="-1"，不進入一般 Tab 順序，只能經由選取進入），
   讓後續方向鍵/Enter 由 board 自己的 keydown 監聽處理，避免跟 piece-slot 的 Enter 監聽衝突
   （否則第一次 Enter 選取的同一個事件會冒泡到 board 層被誤判成「立刻放置」）。
══════════════════════════════════════ */
function selectPieceKeyboard(i){
  if(!pieces[i]) return;
  if(selIdx===i){ deselect(); return; }
  selIdx=i; clearPreview(); renderPieces();
  document.querySelectorAll('#board .cell').forEach(el=>el.classList.add('can-select'));
  showPreview(pieces[i], 4, 4); // 預覽游標初始位置 (4,4)
  setHint('方向鍵移動，Enter 放置　ESC 取消', true);
  document.getElementById('board').focus({preventScroll:true});
}
document.getElementById('board').addEventListener('keydown', e=>{
  if(selIdx===null) return;
  const piece=pieces[selIdx];
  if(!piece) return;
  const cur = previewPos || {r:4,c:4};
  if(e.key==='ArrowUp'){ e.preventDefault(); showPreview(piece, Math.max(0,cur.r-1), cur.c); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); showPreview(piece, Math.min(ROWS-1,cur.r+1), cur.c); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); showPreview(piece, cur.r, Math.max(0,cur.c-1)); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); showPreview(piece, cur.r, Math.min(COLS-1,cur.c+1)); }
  else if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){
    e.preventDefault();
    const placed=doPlace(selIdx, cur.r, cur.c);
    if(placed){
      selIdx=null; hideGhost();
      document.querySelectorAll('#board .cell').forEach(c2=>c2.classList.remove('can-select'));
      setHint(isTouchDevice()?'長按方塊開始拖動':'點擊下方方塊來選取', false);
    } else {
      flashInvalidCells(piece, cur.r, cur.c);
    }
  }
});

// 螢幕報讀播報區（C-3）：aria-live="polite"，先清空再寫入以確保同段文字重複出現時仍會被播報
function announce(msg){
  const el=document.getElementById('aria-announcer');
  if(!el) return;
  el.textContent='';
  setTimeout(()=>{ el.textContent=msg; }, 30);
}

/* ══════════════════════════════════════
   TOUCH DRAG（移動端）
   設計原則：
   1. touchstart on piece-slot → 立即啟動拖動（不需長按）
   2. ghost 顯示在手指正上方（Y 偏移 = ghost高度 + 16px 間距）
   3. 手指移動時用 elementFromPoint 偵測格子，即時顯示預覽
   4. touchend → 放置；若落點無效或在棋盤外 → 取消
   5. 全程 preventDefault 防止頁面滾動
══════════════════════════════════════ */
let touchDragIdx = null;          // 正在拖動的 piece index
let touchEndIdx = null;           // touchend 時確認的 index（避免閉包問題）
let touchDragActive = false;      // 是否已開始移動（區別 tap vs drag）
let touchStartX = 0, touchStartY = 0;
let dragTouchId = null;           // 正在拖動的 Touch.identifier（A5：避免多指觸控互相干擾）
const DRAG_THRESHOLD = 6;         // px，超過才視為拖動

// 從 TouchList 中找出符合 identifier 的觸點，找不到回傳 null（A5）
function findTouchById(touchList, id){
  if(id===null) return null;
  for(let i=0;i<touchList.length;i++) if(touchList[i].identifier===id) return touchList[i];
  return null;
}

// A-4：ghost 視覺位置與落點判定座標須「一致地」固定上移 70px（僅 touch 路徑；桌面滑鼠 hover 不上移）
const TOUCH_GHOST_LIFT = 70;
function liftedTouchPoint(cx, cy){
  return { x: cx, y: cy - TOUCH_GHOST_LIFT };
}

function moveTouchGhost(cx, cy){
  const g = document.getElementById('ghost');
  const p = liftedTouchPoint(cx, cy);
  g.style.left = p.x + 'px';
  g.style.top  = p.y + 'px';
  g.style.display = 'block';
}

// 從觸控座標取得 board cell（排除 ghost 遮擋）；用與 ghost 視覺相同的上移座標判定（A-4 驗收重點：視覺＝判定）
function cellFromTouch(cx, cy){
  const p = liftedTouchPoint(cx, cy);
  const g = document.getElementById('ghost');
  const prev = g.style.display;
  g.style.display = 'none';
  const el = document.elementFromPoint(p.x, p.y);
  g.style.display = prev;
  if(!el) return null;
  return el.closest ? el.closest('.cell') : null;
}

// piece-slot 的 touchstart
function onPieceTouchStart(e, i){
  if(touchDragIdx !== null) return; // 已有拖曳進行中，忽略其他觸點（A5）
  if(!pieces[i]) return;
  e.preventDefault();
  touchDragIdx = i;
  touchEndIdx = i;
  touchDragActive = false;
  const t = e.changedTouches[0];
  dragTouchId = t.identifier;
  touchStartX = t.clientX;
  touchStartY = t.clientY;

  // 立刻更新 ghost 但先不顯示（等移動一點才顯示，避免誤觸）
  updateGhost(pieces[i]);
  const g0 = document.getElementById('ghost');
  g0.style.transition = 'none';
  g0.style.left = t.clientX + 'px';
  g0.style.top  = t.clientY + 'px';
  g0.style.opacity = '0'; // 先透明
  void g0.offsetWidth; // reflow：確保上面「無 transition」的起手位先套用
  g0.style.transition = 'left 0.15s ease, top 0.15s ease';
  moveTouchGhost(t.clientX, t.clientY); // 起手就上移到判定座標，配 transition 滑動避免跳動（A-4）

  // 標記 slot
  const slot = document.querySelector(`.piece-slot[data-idx="${i}"]`);
  if(slot) slot.classList.add('selected');
}

document.addEventListener('touchmove', e=>{
  if(touchDragIdx === null) return;
  const t = findTouchById(e.touches, dragTouchId);
  if(!t) return; // 不是正在拖曳的手指，忽略（A5）
  e.preventDefault();

  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if(!touchDragActive && Math.sqrt(dx*dx+dy*dy) > DRAG_THRESHOLD){
    touchDragActive = true;
    const g = document.getElementById('ghost');
    g.style.transition = ''; // 拖曳開始後移除 transition，讓 ghost 即時跟手
    g.style.opacity = '0.85';
    // 把所有 cell 標記可放置（視覺提示）
    document.querySelectorAll('#board .cell').forEach(el=>el.classList.add('can-select'));
    setHint('放開手指以放置方塊', true);
  }

  if(!touchDragActive) return;

  const piece = pieces[touchDragIdx];
  moveTouchGhost(t.clientX, t.clientY);

  // 預覽落點：用與 ghost 視覺相同的上移座標判定，視覺＝判定（A-4）
  const cell = cellFromTouch(t.clientX, t.clientY);
  if(cell){
    showPreview(piece, +cell.dataset.r, +cell.dataset.c);
  } else {
    clearPreview();
  }
}, {passive:false});

document.addEventListener('touchend', e=>{
  if(touchDragIdx === null) return;
  const t = findTouchById(e.changedTouches, dragTouchId);
  if(!t) return; // 不是正在拖曳的手指，忽略（A5），繼續等待正確手指放開
  e.preventDefault();

  const wasDrag = touchDragActive;
  const draggedIdx = touchEndIdx;

  // 清理視覺狀態（ghost 依放置成功與否分開處理，見下）
  clearPreview();
  document.querySelectorAll('#board .cell').forEach(el=>el.classList.remove('can-select'));
  document.querySelectorAll('.piece-slot.selected').forEach(el=>el.classList.remove('selected'));
  touchDragIdx = null;
  touchDragActive = false;
  dragTouchId = null;

  if(wasDrag){
    // 拖動模式：在放開位置放置
    const cell = cellFromTouch(t.clientX, t.clientY);
    const placed = cell ? doPlace(draggedIdx, +cell.dataset.r, +cell.dataset.c) : false;
    if(placed){
      hideGhost();
      document.getElementById('ghost').style.transform = 'translate(-50%,-50%)';
    } else {
      // 放置失敗：ghost 彈回原本的 piece-slot 再隱藏（B2）
      bounceGhostBack(draggedIdx);
    }
    selIdx = null;
    setHint('長按方塊開始拖動', false);
  } else {
    hideGhost();
    document.getElementById('ghost').style.transform = 'translate(-50%,-50%)'; // 恢復預設
    // 輕點：切換選取（tap-to-select，再 tap cell 放置）
    const slot = document.elementFromPoint(t.clientX, t.clientY);
    if(slot){
      const ps = slot.closest ? slot.closest('.piece-slot') : null;
      if(ps && !ps.classList.contains('empty')){
        const i = +ps.dataset.idx;
        if(selIdx === i){
          selIdx = null;
          renderPieces();
          setHint('長按方塊開始拖動', false);
        } else {
          selIdx = i;
          renderPieces();
          updateGhost(pieces[i]);
          document.querySelectorAll('#board .cell').forEach(el=>el.classList.add('can-select'));
          setHint('點擊格子放置　再次點擊方塊取消', true);
        }
        return;
      }
      // tap on board cell while piece selected
      if(selIdx !== null){
        const cell = slot.closest ? slot.closest('.cell') : null;
        if(cell){
          const sr=+cell.dataset.r, sc=+cell.dataset.c;
          const placed = doPlace(selIdx, sr, sc);
          if(placed){
            selIdx = null; hideGhost();
            document.querySelectorAll('#board .cell').forEach(c=>c.classList.remove('can-select'));
            setHint('長按方塊開始拖動', false);
          } else {
            flashInvalidCells(pieces[selIdx], sr, sc);
          }
        }
      }
    }
  }
},{passive:false});

// 拖曳被系統中斷（來電、下拉通知、邊緣返回手勢等）只會收到 touchcancel，不會有 touchend
// 一律清理視覺狀態，絕不呼叫 doPlace（A4）
document.addEventListener('touchcancel', e=>{
  if(touchDragIdx === null) return;
  const t = findTouchById(e.changedTouches, dragTouchId);
  if(!t) return; // 不是正在拖曳的手指，忽略（A5）

  hideGhost();
  clearPreview();
  document.getElementById('ghost').style.transition = '';
  document.getElementById('ghost').style.transform = 'translate(-50%,-50%)';
  document.querySelectorAll('#board .cell').forEach(el=>el.classList.remove('can-select'));
  document.querySelectorAll('.piece-slot.selected').forEach(el=>el.classList.remove('selected'));
  touchDragIdx = null;
  touchDragActive = false;
  dragTouchId = null;
  selIdx = null;
  setHint(isTouchDevice()?'長按方塊開始拖動':'點擊下方方塊來選取', false);
},{passive:false});

// ghost 的 touchmove 不需要重複，已在 document 層處理

/* ══════════════════════════════════════
   GAME LOGIC
══════════════════════════════════════ */
function doPlace(idx,sr,sc){
  const piece=pieces[idx];
  if(!piece||!canPlace(piece,sr,sc)) return false;

  // A-2：成功放置前先拍快照（單層 undo），下方任何 grid/pieces/score/level 變動都在此之後
  takeUndoSnapshot();

  // 記錄本次放置涉及的座標（用於落地動畫，B4）
  const placedCoords=[];
  for(let r=0;r<piece.shape.length;r++)
    for(let c=0;c<piece.shape[r].length;c++)
      if(piece.shape[r][c]) placedCoords.push([sr+r,sc+c]);

  placePiece(piece,sr,sc);
  pieces[idx]=null;
  clearPreview();

  const {fr,fc}=findFullLines();
  const total=fr.length+fc.length;

  // 成就：首次消行／單次雙消／單次三消（C-2），時機只需 total 確定即可判定
  if(total>0) unlockAchievement('first_clear');
  if(total>=2) unlockAchievement('double_clear');
  if(total>=3) unlockAchievement('triple_clear');

  // Count obstacle cells caught in cleared lines（必須在 eraseLines 之前計算）
  const obsCleared = total>0 ? countObsInLines(fr,fc) : 0;

  const clearedSet=new Set();
  if(total>0){
    // 先重繪棋盤：讓新放置的方塊、以及尚未清除的整行/列都先顯示出來，
    // 才能把即將消除的格子加上動畫 class；隨後立即同步清除 grid 資料（A1）。
    renderBoard();
    const toAnim=new Set();
    fr.forEach(r=>{ for(let c=0;c<COLS;c++) toAnim.add(r*COLS+c); });
    fc.forEach(c=>{ for(let r=0;r<ROWS;r++) toAnim.add(r*COLS+c); });
    const cells=document.querySelectorAll('#board .cell');
    // 消行粒子（B-3）：單次事件上限 60 粒，reduced-motion 時完全不產生
    let particleBudget = prefersReducedMotion() ? 0 : 60;
    const pWrap = particleBudget>0 ? document.querySelector('.board-wrap') : null;
    const pWrapRect = pWrap ? pWrap.getBoundingClientRect() : null;
    toAnim.forEach(idx2=>{
      clearedSet.add(idx2);
      const el=cells[idx2]; if(!el) return;
      // Obstacle cells get a special flashier animation
      const r2=Math.floor(idx2/COLS), c2=idx2%COLS;
      const cellVal=grid[r2][c2];
      if(cellVal===OBS) el.classList.add('obs-clearing');
      else               el.classList.add('clearing');
      if(pWrap && particleBudget>0){
        const color = cellVal===OBS ? 'var(--obstacle-fg)' : cellVal;
        particleBudget -= spawnClearParticles(pWrap, pWrapRect, el, color, particleBudget);
      }
    });
    // 資料同步清除：grid 立即更新，避免 400ms 視窗內重複計分或存檔不一致（A1）
    eraseLines(fr,fc);

    // 統計：累計消行數／單次最高消行（C-1）
    stats.totalLines += total;
    if(total > stats.maxCombo) stats.maxCombo = total;
    gameLines += total; // D-1：本局累計消行數，供 game over 時寫入歷史紀錄

    // 成就：清空全盤（C-2）。判定時機必須在資料同步清除之後、且在下方升級可能生成新障礙物之前，
    // 否則升級補的障礙物會讓「全空」誤判為未達成。
    if(grid.every(row=>row.every(v=>v===null))) unlockAchievement('clear_board');

    // 落地動畫：只套用在「不會被立刻消除」的格子上，避免與 clearing 動畫衝突（B4）
    placedCoords.forEach(([r,c])=>{
      const flatIdx=r*COLS+c;
      if(clearedSet.has(flatIdx)) return;
      const el=cells[flatIdx];
      if(el){
        el.classList.add('place-pop');
        el.addEventListener('animationend', ()=>el.classList.remove('place-pop'), {once:true});
      }
    });
  }

  // ── Scoring ──
  const cellCount = piece.shape.flat().filter(Boolean).length;
  const lineBonus  = total>0 ? COMBO_BONUS[Math.min(total,COMBO_BONUS.length-1)]+total*18 : 0;
  const obsBonus   = obsCleared * OBS_BONUS_PER_CELL;
  const pts        = cellCount + lineBonus + obsBonus;
  score += pts;

  // ── Streak（B-1）：有消行才累加，斷檔（本次無消行）歸零；streak≥2 起在消行分之後加獎勵分 ──
  if(total>0) streak++; else streak=0;
  const streakBonus = (total>0 && streak>=2) ? streak*5 : 0;
  if(streakBonus>0) score += streakBonus;

  // 統計／成就：最高連續 streak（C-1）／streak×5 成就（C-2）
  if(streak > stats.maxStreak) stats.maxStreak = streak;
  if(streak >= 5) unlockAchievement('streak5');
  if(streak > gameMaxStreak) gameMaxStreak = streak; // D-1：本局最高 streak，供 game over 時寫入歷史紀錄

  // 成就：單局分數門檻（C-2），score 此時已含本次 pts 與 streakBonus
  if(score >= 500)  unlockAchievement('score500');
  if(score >= 1000) unlockAchievement('score1000');

  // ── Level-up check：務必在「非動畫分支的 renderBoard」／postPlace()／isGameOver() 之前生成障礙物（A2）──
  const nl = Math.floor(score/100)+1;
  let newObsCoords = []; // D-2：本次放置若升級生成障礙物，座標要記進這步的 move.obs，回放才能重現
  if(nl > level){
    level = nl;
    triggerLevelUpFlash();
    sfxLevelUp();
    // Spawn new obstacles for the new level (fill up to target count)
    const target = obsCount(level);
    const current = countObstacles();
    if(target > current) newObsCoords = spawnObstacles(target - current);
  }
  // 成就：等級 5（C-2）。不限定「剛好升到」，重載後若已達等級 5 也該補判（累積型成就）
  if(level >= 5) unlockAchievement('level5');

  // D-2：回放記錄 — 上限 500 步，超過停止記錄該局回放（歷史仍記分數與 final grid，見 recordHistoryEntry）。
  // d/c 用 index 引用 PIECE_DEFS/COLORS，不存整個形狀陣列；s 存放置後的累計分數（回放直接顯示，不重算）。
  if(moves.length < MOVES_CAP){
    const d = findPieceDefIndex(piece.shape);
    const cIdx = COLORS.indexOf(piece.color);
    if(d>=0 && cIdx>=0){
      moves.push({d, c:cIdx, r:sr, col:sc, obs:newObsCoords, s:score});
    }
  }

  if(total===0){
    // 沒有消行：grid 資料（含新放置的方塊、可能新生成的障礙物）此時已定案，直接重繪一次即可，
    // 障礙物不會被 400ms 動畫窗口延遲顯示。
    renderBoard();
    placedCoords.forEach(([r,c])=>{
      const el=cellEl(r,c);
      if(el){
        el.classList.add('place-pop');
        el.addEventListener('animationend', ()=>el.classList.remove('place-pop'), {once:true});
      }
    });
  }

  renderObsPips();

  // ── 補牌／game-over 判定：grid 資料（含新障礙物）此時已完全就緒（A2）──
  postPlace();

  const oldBest = best; // 記錄 updateStats() 覆寫 best 之前的舊值，供 B15 判斷是否剛破紀錄
  updateStats();
  saveProg();
  saveStats(); // C-1：totalLines/maxCombo/maxStreak 這幾格上面已就緒，這裡統一存檔

  // 螢幕報讀：播報本次放置結果（C-3）
  announce(total>0 ? `消除 ${total} 行，得 ${pts} 分` : `放置成功，得 ${pts} 分`);

  // 一次消 ≥2 行的 combo 慶祝（B5）
  if(total>=2) showComboPop(total);

  // 觸覺回饋（B14）
  if(total>0) navigator.vibrate?.([15,30,15]);
  else        navigator.vibrate?.(10);

  // Score pop — show obstacle bonus separately if any
  const br=document.getElementById('board').getBoundingClientRect();
  const popX=br.left+br.width/2-24, popY=br.top+24;
  if(obsBonus>0){
    showScorePop(pts-obsBonus, popX, popY, false);
    setTimeout(()=>showScorePop(obsBonus, popX-10, popY+30, true), 120);
  } else {
    showScorePop(pts, popX, popY, false);
  }
  // streak 獎勵分另外顯示「🔥+N」，避開 obsBonus pop 的位置與時序（B-1）
  if(streakBonus>0){
    const streakDelay = obsBonus>0 ? 240 : 120;
    const streakY = obsBonus>0 ? popY+60 : popY+30;
    setTimeout(()=>showStreakPop(streakBonus, popX-10, streakY), streakDelay);
  }

  // 首次超越最高分的一次性 toast（B15）
  if(!recordToastShown && oldBest>0 && score>oldBest){
    recordToastShown=true;
    showRecordToast();
  }

  // 放置音效（A-1）：有消行播消行音（依 total 音高上揚），否則播放置成功音
  if(total>0) sfxClear(total); else sfxPlace();
  // streak≥2 起的加成音，音高隨 streak 遞增（B-1）
  if(streakBonus>0) sfxStreak(streak);

  // 450ms 後只負責重繪棋盤（配合 obsFlash 0.45s），不可再動 grid 資料（A1/A8）
  if(total>0){
    pendingClearTimer = setTimeout(()=>{ renderBoard(); pendingClearTimer=null; },450);
  }

  return true;
}

function postPlace(){
  if(pieces.every(p=>!p)) pieces=rollFairPieceSet();
  renderPieces();
  updateDangerState(); // B-2：每次放置/補牌後重算 totalMoves
  if(isGameOver()) showGameOver();
}

function showGameOver(fromResume){
  saveProg();
  sfxGameOver();
  document.getElementById('final-score').textContent=score;
  const recordEl=document.getElementById('final-record');
  const isRecord=score>0&&score>=best;
  recordEl.textContent=isRecord?'🎉 新紀錄！':'';
  recordEl.style.display=isRecord?'':'none';
  document.getElementById('final-best-label').textContent=`最高分: ${best}`;
  document.getElementById('game-over-overlay').classList.add('show');
  navigator.vibrate?.(80);
  // 統計：games/totalScore 只在「真正剛結束」時累計一次；resumeOrNew() 讀到已死局面補畫面時
  // 傳 fromResume=true 跳過計數，避免同一局在每次重整頁面時被重複計入（C-1）
  if(!fromResume){
    stats.games += 1;
    stats.totalScore += score;
    saveStats();
    recordHistoryEntry(); // D-1：同一個 fromResume guard，避免 resume 重整補畫面時重複寫入歷史
  }
}

/* ══════════════════════════════════════
   NEW GAME / INIT
══════════════════════════════════════ */
function newGame(){
  loadBest(); clearState();
  if(pendingClearTimer){ clearTimeout(pendingClearTimer); pendingClearTimer=null; } // A-2：新局清空 pending 重繪
  grid=emptyGrid(); score=0; level=1; streak=0; // B-1：新局 streak 歸零
  pieces=[randPiece(),randPiece(),randPiece()];
  selIdx=null;
  recordToastShown=false; // B15：新局重新允許顯示一次新紀錄 toast
  resetUndo(); // A-2：新局清空 undo 快照
  // D-2：新局重置回放記錄，開局另存 initialGrid 快照
  moves=[]; gameLines=0; gameMaxStreak=0;
  initialGrid=deepCloneGrid(grid);
  document.getElementById('game-over-overlay').classList.remove('show');
  hideGhost(); renderBoard(); renderPieces(); updateStats(); renderObsPips(); updateDangerState();
  setHint(isTouchDevice()?'長按方塊開始拖動，或點一下選取':'點擊下方方塊來選取',false);
}

function resumeOrNew(){
  loadBest();
  if(loadState()){
    // 已經達到/超過 best 的存檔視為「這次破紀錄時刻已過」，避免重載後重複跳 toast
    recordToastShown = score>=best;
    resetUndo(); // A-2：重載後沒有快照，不可 undo
    renderBoard(); renderPieces(); updateStats(); renderObsPips(); updateDangerState();
    setHint(isTouchDevice()?'長按方塊開始拖動，或點一下選取':'點擊下方方塊來選取',false);
    if(isGameOver()) showGameOver(true); // A3：讀檔後若其實已是死局，補上結算畫面；C-1：resume 不重複計入 stats
  } else {
    newGame();
  }
}

document.getElementById('new-game-btn').addEventListener('click', ()=>{ sfxClick(); newGame(); });
document.getElementById('retry-btn').addEventListener('click', ()=>{
  sfxClick();
  document.getElementById('game-over-overlay').classList.remove('show');
  newGame();
});
document.getElementById('undo-btn').addEventListener('click', doUndo);

/* ══════════════════════════════════════
   統計／成就 overlay（C-1/C-2）
   tab 機制刻意寫成通用：每個 tab 按鈕帶 data-tab，對應面板帶 data-tab-panel，
   點擊時用同一份邏輯切換 active/aria-selected/hidden。Wave D 之後只需在 HTML
   多加一個 data-tab="history" 按鈕＋對應面板，這裡的 initInfoTabs() 完全不用改。
══════════════════════════════════════ */
function initInfoTabs(container){
  const tabs = container.querySelectorAll('.info-tab');
  tabs.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      sfxClick();
      stopReplayPlaying(); // D-2：切換 tab 時停止背景播放計時器（不影響回放子面板本身的顯示/隱藏狀態）
      const target = btn.dataset.tab;
      container.querySelectorAll('.info-tab').forEach(b=>{
        const active = b===btn;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', active?'true':'false');
      });
      container.querySelectorAll('.info-tab-panel').forEach(p=>{
        const active = p.dataset.tabPanel===target;
        p.classList.toggle('active', active);
        p.hidden = !active;
      });
    });
  });
}
function renderStatsPanel(){
  const panel=document.getElementById('tab-panel-stats');
  if(!panel) return;
  const rows=[
    ['最高分', best],
    ['總局數', stats.games],
    ['累計分數', stats.totalScore],
    ['累計消行', stats.totalLines],
    ['單次最高消行', stats.maxCombo],
    ['最高連續 Streak', stats.maxStreak],
  ];
  panel.innerHTML = '<div class="stats-list">' + rows.map(([label,value])=>
    `<div class="stats-list-row"><span class="stats-list-label">${label}</span><span class="stats-list-value">${value}</span></div>`
  ).join('') + '</div>';
}
function renderAchievementsPanel(){
  const panel=document.getElementById('tab-panel-ach');
  if(!panel) return;
  panel.innerHTML = '<div class="ach-grid">' + ACHIEVEMENTS.map(a=>{
    const unlocked = achieved.has(a.id);
    return `<div class="ach-card${unlocked?'':' locked'}"><span class="ach-icon">${unlocked?'🏅':'🔒'}</span><span class="ach-label">${a.label}</span></div>`;
  }).join('') + '</div>';
}
function openStatsOverlay(){
  renderStatsPanel();
  renderAchievementsPanel();
  renderHistoryPanel(); // D-1
  // D-2：每次打開都重置回歷史清單檢視，避免殘留上次工作階段的回放子面板狀態
  document.getElementById('history-list-view').hidden=false;
  document.getElementById('history-replay-view').hidden=true;
  document.getElementById('stats-overlay').classList.add('show');
}
function closeStatsOverlay(){
  document.getElementById('stats-overlay').classList.remove('show');
  closeReplay(); // D-2：關閉整個 overlay 時一併清理回放狀態（停止計時器＋收回子面板），避免背景殘留
}
function initStatsOverlay(){
  const overlay=document.getElementById('stats-overlay');
  if(!overlay) return;
  initInfoTabs(overlay);
  document.getElementById('stats-btn').addEventListener('click', ()=>{ sfxClick(); openStatsOverlay(); });
  document.getElementById('stats-close-btn').addEventListener('click', ()=>{ sfxClick(); closeStatsOverlay(); });
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeStatsOverlay(); });
  initHistoryPanel(); // D-1/D-2
}

/* ══════════════════════════════════════
   歷史清單 UI（D-1）
══════════════════════════════════════ */
function formatHistoryDate(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderHistoryThumb(finalGridStr){
  let html = '<div class="history-thumb">';
  for(let i=0;i<ROWS*COLS;i++){
    const val = decodeGridCell(finalGridStr[i]);
    let bg = 'transparent';
    if(val===OBS) bg='var(--obstacle-fg)';
    else if(val) bg=val;
    html += `<div class="history-thumb-cell" style="background:${bg}"></div>`;
  }
  html += '</div>';
  return html;
}
function renderHistoryPanel(){
  const listEl=document.getElementById('history-list');
  if(!listEl) return;
  if(history.length===0){
    listEl.innerHTML = '<div class="history-empty">尚無紀錄</div>';
    return;
  }
  listEl.innerHTML = history.map((entry,i)=>{
    const replayDisabled = !entry.moves;
    return `<div class="history-card">
      ${renderHistoryThumb(entry.finalGrid)}
      <div class="history-card-info">
        <div class="history-card-date">${formatHistoryDate(entry.ts)}</div>
        <div class="history-card-stats">分數 ${entry.score}　等級 ${entry.level}　消行 ${entry.lines}</div>
      </div>
      <button class="btn history-replay-btn" type="button" data-replay-idx="${i}"${replayDisabled?' disabled':''}>${replayDisabled?'局過長，無回放':'回放'}</button>
    </div>`;
  }).join('');
}
function initHistoryPanel(){
  const listEl=document.getElementById('history-list');
  if(!listEl) return;
  listEl.addEventListener('click', e=>{
    const btn = e.target.closest('[data-replay-idx]');
    if(!btn || btn.disabled) return;
    sfxClick();
    openReplay(+btn.dataset.replayIdx);
  });
  document.getElementById('history-clear-btn').addEventListener('click', ()=>{
    sfxClick();
    if(confirm('確定要清除所有歷史紀錄嗎？')){
      history=[];
      saveHistory();
      renderHistoryPanel();
    }
  });
  document.getElementById('replay-prev-btn').addEventListener('click', ()=>{ sfxClick(); replayPrev(); });
  document.getElementById('replay-next-btn').addEventListener('click', ()=>{ sfxClick(); replayNext(); });
  document.getElementById('replay-play-btn').addEventListener('click', ()=>{ sfxClick(); replayTogglePlay(); });
  document.getElementById('replay-close-btn').addEventListener('click', ()=>{ sfxClick(); closeReplay(); });
  document.querySelectorAll('.replay-speed-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ sfxClick(); setReplaySpeed(+b.dataset.speed); });
  });
}

/* ══════════════════════════════════════
   回放引擎（D-2）
   純重演：獨立變數（replayEntry/replayStep/replayGrid）＋獨立 mini board（#replay-board），
   全程不觸碰真實遊戲狀態（grid/pieces/score/undo 快照/localStorage 皆不動）。
   分數直接顯示紀錄的 s 值，不重算（避免未來計分改版讓舊回放對不上）。
══════════════════════════════════════ */
let replayEntry = null;   // 目前正在回放的歷史紀錄（history[] 中的一筆）
let replayStep = 0;       // 目前顯示到第幾步（0＝initialGrid，N＝moves[0..N-1] 已套用）
let replayGrid = null;    // 回放專用棋盤資料，與真實 grid 完全獨立
let replayTimer = null;   // 播放中／消行動畫中的 setTimeout id
let replayPlaying = false;
let replaySpeed = 1;      // 1 / 2 / 4

// 在任意 grid 上套用一筆 move（純函式：放置→消行→補障礙物，邏輯對齊 doPlace 的資料面），
// 完全不碰真實遊戲的 grid，複用 findFullLines/eraseLines 的 g 參數化版本
function applyReplayMove(g, move){
  const shape = PIECE_DEFS[move.d];
  const color = COLORS[move.c];
  for(let r=0;r<shape.length;r++)
    for(let c=0;c<shape[r].length;c++)
      if(shape[r][c]) g[move.r+r][move.col+c]=color;
  const {fr,fc}=findFullLines(g);
  eraseLines(fr,fc,g);
  (move.obs||[]).forEach(([r,c])=>{ g[r][c]=OBS; });
  return {fr,fc};
}
function computeReplayGridAtStep(entry, stepIdx){
  const g = decodeGrid(entry.initialGrid);
  for(let i=0;i<stepIdx;i++) applyReplayMove(g, entry.moves[i]);
  return g;
}
function replayScoreAtStep(entry, stepIdx){
  return stepIdx>0 ? entry.moves[stepIdx-1].s : 0;
}
function replayCellClass(r,c,val){
  const boxRow=Math.floor(r/3), boxCol=Math.floor(c/3);
  let cls='cell';
  if((boxRow+boxCol)%2===1) cls+=' cell-alt';
  if(val===OBS) cls+=' has-piece obstacle';
  else if(val) cls+=' has-piece';
  return cls;
}
function renderReplayBoard(g){
  const board=document.getElementById('replay-board');
  if(!board) return;
  board.innerHTML='';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const el=document.createElement('div');
    const val=g[r][c];
    el.className=replayCellClass(r,c,val);
    if(val && val!==OBS) el.style.background=val;
    el.dataset.r=r; el.dataset.c=c;
    board.appendChild(el);
  }
}
function updateReplayControls(){
  if(!replayEntry) return;
  const total = replayEntry.moves.length;
  document.getElementById('replay-prev-btn').disabled = replayStep<=0;
  document.getElementById('replay-next-btn').disabled = replayStep>=total;
  document.getElementById('replay-play-btn').disabled = replayStep>=total;
  document.getElementById('replay-play-btn').textContent = replayPlaying ? '暫停' : '播放';
  document.getElementById('replay-status').textContent = replayStep>=total ? '回放結束' : '';
  document.getElementById('replay-score').textContent = '分數：' + replayScoreAtStep(replayEntry, replayStep);
}
function stopReplayPlaying(){
  replayPlaying = false;
  if(replayTimer){ clearTimeout(replayTimer); replayTimer=null; }
}
// 靜態跳到指定步數（不做逐格動畫），用於「上一步」
function renderReplayStepStatic(stepIdx){
  if(!replayEntry) return;
  replayStep = Math.max(0, Math.min(replayEntry.moves.length, stepIdx));
  replayGrid = computeReplayGridAtStep(replayEntry, replayStep);
  renderReplayBoard(replayGrid);
  updateReplayControls();
}
// 前進一步，帶「放置→消行」動畫，時序：先顯示放置的方塊，若該步有消行才顯示消除動畫再移除格子
function advanceReplayStepAnimated(onDone){
  if(!replayEntry) return;
  const total = replayEntry.moves.length;
  if(replayStep>=total){ onDone && onDone(); return; }
  const move = replayEntry.moves[replayStep];
  const shape = PIECE_DEFS[move.d];
  const color = COLORS[move.c];
  const placedGrid = replayGrid.map(row=>row.slice());
  const placedCoords=[];
  for(let r=0;r<shape.length;r++)
    for(let c=0;c<shape[r].length;c++)
      if(shape[r][c]){ placedGrid[move.r+r][move.col+c]=color; placedCoords.push([move.r+r,move.col+c]); }
  renderReplayBoard(placedGrid);
  placedCoords.forEach(([r,c])=>{
    const el=document.querySelector(`#replay-board .cell[data-r="${r}"][data-c="${c}"]`);
    if(el) el.classList.add('place-pop');
  });
  const {fr,fc}=findFullLines(placedGrid);
  const stepDur = 600/replaySpeed;
  if(fr.length||fc.length){
    const toAnim=new Set();
    fr.forEach(r=>{ for(let c=0;c<COLS;c++) toAnim.add(r*COLS+c); });
    fc.forEach(c=>{ for(let r=0;r<ROWS;r++) toAnim.add(r*COLS+c); });
    toAnim.forEach(idx2=>{
      const r2=Math.floor(idx2/COLS), c2=idx2%COLS;
      const el=document.querySelector(`#replay-board .cell[data-r="${r2}"][data-c="${c2}"]`);
      if(el) el.classList.add(placedGrid[r2][c2]===OBS?'obs-clearing':'clearing');
    });
    replayTimer = setTimeout(()=>{
      replayTimer=null;
      eraseLines(fr,fc,placedGrid);
      (move.obs||[]).forEach(([r,c])=>{ placedGrid[r][c]=OBS; });
      replayGrid = placedGrid;
      replayStep++;
      renderReplayBoard(replayGrid);
      updateReplayControls();
      onDone && onDone();
    }, Math.min(380, stepDur*0.7));
  } else {
    (move.obs||[]).forEach(([r,c])=>{ placedGrid[r][c]=OBS; });
    replayGrid = placedGrid;
    replayStep++;
    renderReplayBoard(replayGrid);
    updateReplayControls();
    onDone && onDone();
  }
}
function replayNext(){
  if(!replayEntry) return;
  stopReplayPlaying();
  advanceReplayStepAnimated();
}
function replayPrev(){
  if(!replayEntry) return;
  stopReplayPlaying();
  renderReplayStepStatic(replayStep-1);
}
function replayTogglePlay(){
  if(!replayEntry) return;
  if(replayPlaying){ stopReplayPlaying(); updateReplayControls(); return; }
  if(replayStep>=replayEntry.moves.length) return;
  replayPlaying = true;
  updateReplayControls();
  const tick=()=>{
    if(!replayPlaying) return;
    const total=replayEntry.moves.length;
    if(replayStep>=total){ stopReplayPlaying(); updateReplayControls(); return; }
    advanceReplayStepAnimated(()=>{
      if(!replayPlaying) return;
      if(replayStep>=total){ stopReplayPlaying(); updateReplayControls(); return; }
      replayTimer=setTimeout(tick, 600/replaySpeed);
    });
  };
  tick();
}
function setReplaySpeed(sp){
  replaySpeed = sp;
  document.querySelectorAll('.replay-speed-btn').forEach(b=>{
    b.classList.toggle('active', +b.dataset.speed===sp);
  });
}
function openReplay(entryIdx){
  const entry = history[entryIdx];
  if(!entry || !entry.moves) return; // 局過長（moves 為 null）不提供回放
  stopReplayPlaying();
  replayEntry = entry;
  replayStep = 0;
  replayGrid = decodeGrid(entry.initialGrid);
  document.getElementById('history-list-view').hidden = true;
  document.getElementById('history-replay-view').hidden = false;
  renderReplayBoard(replayGrid);
  updateReplayControls();
}
function closeReplay(){
  stopReplayPlaying();
  replayEntry = null; replayGrid = null; replayStep = 0;
  const replayView=document.getElementById('history-replay-view');
  const listView=document.getElementById('history-list-view');
  if(replayView) replayView.hidden = true;
  if(listView) listView.hidden = false;
}

/* ══════════════════════════════════════
   PWA 安裝按鈕（C-5）
   不支援 beforeinstallprompt 的瀏覽器（如 iOS Safari）永遠不會觸發事件，
   按鈕維持 HTML 內聯的 display:none，不做任何 fallback 提示。
══════════════════════════════════════ */
let deferredInstallPrompt = null;
function initInstallButton(){
  const btn=document.getElementById('install-btn');
  if(!btn) return;
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    btn.style.display = '';
  });
  btn.addEventListener('click', ()=>{
    if(!deferredInstallPrompt) return;
    sfxClick();
    const promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    btn.style.display = 'none';
    promptEvent.prompt();
  });
  window.addEventListener('appinstalled', ()=>{
    deferredInstallPrompt = null;
    btn.style.display = 'none';
  });
}

/* ══════════════════════════════════════
   THEME TOGGLE（design spec §E）
   FOUC-safe 的初次主題判定已在 <head> 內聯 script 完成（設定 data-theme）；
   這裡只負責 runtime 切換：更新 data-theme、寫回 localStorage、同步 meta theme-color。
══════════════════════════════════════ */
const SK_THEME = 'bpz_v4_theme';
function applyThemeColor(theme){
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', theme==='dark' ? '#17151F' : '#F6F5FB');
}
function initThemeToggle(){
  const btn = document.getElementById('theme-toggle-btn');
  if(!btn) return;
  // 讓 meta theme-color 與 <head> 內聯 script 已解析出的主題保持一致（避免 pre-JS fallback 值殘留）
  applyThemeColor(document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light');
  btn.addEventListener('click', ()=>{
    sfxClick();
    const current = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
    const next = current==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem(SK_THEME, next); }catch(e){}
    applyThemeColor(next);
  });
}

if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

initBoardEvents();
initThemeToggle();
initSoundToggle();
initStatsOverlay();
initInstallButton();
resumeOrNew();
</script>
